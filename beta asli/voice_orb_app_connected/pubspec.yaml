name: voice_orb_app
description: A voice-assistant style UI with a color-reactive orb, wired to the Beta backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.3
  # Runtime microphone permission requests (Android 6+ requires the grant
  # at runtime; the manifest line alone is not enough).
  permission_handler: ^11.3.0
  # --- Backend integration -------------------------------------------------
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  http: ^1.2.2

  # --- Settings persistence -------------------------------------------------
  shared_preferences: ^2.2.3

  # --- Family Talk (walkie-talkie voice notes) -----------------------------
  # record: microphone recording to a file (.m4a AAC)
  record: ^5.1.2
  # just_audio: playback of received voice notes through the
  # backend's authorized playback endpoint (auth header attached).
  just_audio: ^0.9.43

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true